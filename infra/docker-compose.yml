# Local stack. Run via `make up` (which passes --env-file .env from the repo root).
name: atlas

x-python-service: &python-service
  restart: unless-stopped
  environment: &python-env
    ENVIRONMENT: local
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on: &service-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
  deploy:
    resources:
      limits: { memory: 256m }

services:
  # ---------- data ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      SYNC_DB_PASSWORD: ${SYNC_DB_PASSWORD:?}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?}
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD:?}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init; a typo must fail, not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafkadata:/var/lib/kafka/data]
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
      PARTITIONS: 6
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
      - ../libs/events/topics.txt:/scripts/topics.txt:ro
    depends_on:
      kafka: { condition: service_healthy }

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ["8081:8081"]
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------- observability ----------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  # ---------- services ----------
  gateway:
    build: { context: .., dockerfile: services/gateway/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 128m }

  brokerage-sync:
    build: { context: .., dockerfile: services/brokerage-sync/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://sync_svc:${SYNC_DB_PASSWORD}@postgres:5432/atlas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on: *service-deps
    deploy:
      resources:
        limits: { memory: 128m }

  auth:
    <<: *python-service
    build: { context: .., dockerfile: services/auth/Dockerfile }
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/atlas

  portfolio:
    <<: *python-service
    build: { context: .., dockerfile: services/portfolio/Dockerfile }
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://portfolio_svc:${PORTFOLIO_DB_PASSWORD}@postgres:5432/atlas

  analytics:
    <<: *python-service
    build: { context: .., dockerfile: services/analytics/Dockerfile }
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://analytics_svc:${ANALYTICS_DB_PASSWORD}@postgres:5432/atlas

  risk:
    <<: *python-service
    build: { context: .., dockerfile: services/risk/Dockerfile }
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://risk_svc:${RISK_DB_PASSWORD}@postgres:5432/atlas

  ai:
    <<: *python-service
    build: { context: .., dockerfile: services/ai/Dockerfile }
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://ai_svc:${AI_DB_PASSWORD}@postgres:5432/atlas

  notifications:
    <<: *python-service
    build: { context: .., dockerfile: services/notifications/Dockerfile }
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://notifications_svc:${NOTIFICATIONS_DB_PASSWORD}@postgres:5432/atlas

volumes:
  pgdata:
  redisdata:
  kafkadata:
