# Install with the shared scripts so Compose and Kubernetes use one source of truth:
#   helm install atlas-deps infra/helm/atlas-deps -n atlas \
#     --set-file postgres.initScript=infra/postgres/init/01-roles-and-schemas.sh \
#     --set-file kafka.createTopicsScript=infra/kafka/create-topics.sh \
#     --set-file kafka.topics=libs/events/topics.txt

postgres:
  image: postgres:16-alpine
  storage: 2Gi
  initScript: ""
  # Local-only passwords; on AWS these live in Secrets Manager.
  passwords:
    POSTGRES_PASSWORD: change-me-postgres
    AUTH_DB_PASSWORD: change-me-auth
    SYNC_DB_PASSWORD: change-me-sync
    PORTFOLIO_DB_PASSWORD: change-me-portfolio
    ANALYTICS_DB_PASSWORD: change-me-analytics
    RISK_DB_PASSWORD: change-me-risk
    AI_DB_PASSWORD: change-me-ai
    NOTIFICATIONS_DB_PASSWORD: change-me-notifications

redis:
  image: redis:7-alpine

kafka:
  image: apache/kafka:3.9.1
  storage: 2Gi
  partitions: 6
  createTopicsScript: ""
  topics: ""
