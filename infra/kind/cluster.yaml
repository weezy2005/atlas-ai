# Local multi-node cluster: pods spread across two workers like they would across AZs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: atlas
nodes:
  - role: control-plane
    extraPortMappings:
      # Gateway NodePort -> http://localhost:18080
      - containerPort: 30080
        hostPort: 18080
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-a }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-b }
