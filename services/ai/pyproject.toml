[project]
name = "atlas-ai"
version = "0.1.0"
description = "Copilot: Claude tool calling over Portfolio/Analytics/Risk (Phase 6)."
requires-python = ">=3.12,<3.13"
dependencies = ["atlas-common"]

[tool.uv.sources]
atlas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ai"]
