[project]
name = "atlas-auth"
version = "0.1.0"
description = "Signup, login, JWT issuance and refresh-token rotation (Phase 2)."
requires-python = ">=3.12,<3.13"
dependencies = ["atlas-common"]

[tool.uv.sources]
atlas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_auth"]
