[project]
name = "atlas-portfolio"
version = "0.1.0"
description = "Normalized positions, transactions, balances and snapshots (Phase 4)."
requires-python = ">=3.12,<3.13"
dependencies = ["atlas-common"]

[tool.uv.sources]
atlas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_portfolio"]
